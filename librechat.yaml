# LibreChat configuration
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.13
cache: true

# The local Langflow host is auto-exempted from the MCP SSRF block — its host:port is derived
# from VITE_LANGFLOW_URL in code (api/server/services/initializeMCPs.js), so no host is hardcoded
# here. Add other services to mcpSettings.allowedAddresses if you need to exempt them too.

interface:
  marketplace:
    use: false
  langflow: false
  # Hide the chat header's 預設設定 (presets) button.
  presets: false
  # Show the chat header's 新增多重對話 (multi-convo) button. Keep it explicit: roles already
  # stored with it off stay off when the key is omitted.
  multiConvo: true
  # Turn off bookmarks for every role: the chat header's 新增書籤 icon, the mobile ⋯ menu
  # entry and the sidebar chat filter's bookmark section all disappear.
  bookmarks: false
  # Hide the agent builder's 遠端存取 (globe) button for every role.
  remoteAgents:
    share: false
    public: false
  # Scheduled chats (upstream default: off). Firing needs Redis streams or, on a
  # single replica without Redis, SCHEDULES_SINGLE_PROCESS=true in .env.
  # Temporarily disabled: absent config = off (server getLimits + side-nav entry).
  # Uncomment to re-enable.
  # schedules:
  #   use: true
  #   create: true

endpoints:
  # Conversation titles for every endpoint (overrides any per-endpoint titlePrompt).
  # Upstream's default completion prompt asks for "title case", which pushes models
  # to English; this is pwc_tars's own title prompt, so both products name a conversation the
  # same way. `{convo}` is required: it is replaced by the conversation.
  all:
    titlePrompt: |-
      請用10個字以內的繁體中文為以下問題生成一個簡短的對話標題，只回覆標題文字：
      {convo}
  agents:
    # Capabilities available to Agents. `tools` is what lets an Agent call MCP tools
    # (e.g. the Langflow flows exposed below).
    capabilities:
      - tools
      - actions
      - file_search
      - artifacts
      - execute_code
      - web_search
      - sql_agent
      - rag_agent
      - chart_agent
      - file_agent
      - skills
      - context
    # Tool library items hidden from the agent builder, by pluginKey or builtin id. Display
    # only: agents that already carry one keep it. Remove a line and restart to offer it again.
    hiddenTools:
      - handoffs
      - traversaal_search
      - google
      - wolfram
      - tavily_search_results_json
      - calculator
      - stable-diffusion
      - azure-ai-search
      - open_weather
      - flux
      - tars_plugin_python_exec
      - tars_plugin_summarize_text
      - tars_plugin_text_stats
    # Hide the agent builder's Inline/Prompt instructions toggle, leaving inline only. Agents
    # already linked to a prompt keep the toggle so they can switch back. Default: false.
    hideInstructionsSource: true
    # Append "Current date: YYYY-MM-DD (Weekday)" (user's timezone) to every agent turn, as
    # pwc_tars's own chat does, so relative ranges ("the last month") reach tools as real
    # dates instead of the model's training-era guess. Skipped for agents whose instructions
    # already use {{current_date}} / {{current_datetime}} / {{iso_datetime}}, and for the
    # LLM gateway (/api/agents/v1m), whose caller builds the whole prompt. Default: true.
    injectCurrentDate: true

  custom:
    # Local (地端) models served by vLLM. This endpoint is fully auto-discovered
    # from the pwc_tars model registry — the special baseURL `tars://local` tells
    # LibreChat to source BOTH the model list and each model's host live from
    # pwc_tars `GET /api/model/health_status` (30s TTL cache):
    #   - Which models appear = whichever local models are currently loaded on any
    #     vLLM host (availability-gated; the whole endpoint is hidden when none are
    #     up or pwc_tars is unreachable — nothing to fall back to).
    #   - Each model routes to its OWN host (models may live on different machines;
    #     e.g. gemma-4-31B and a deepseek-reasoner build can be on separate boxes).
    # Add a local model purely on the pwc_tars side (register it in model_profile
    # with its endpoint + serve it on vLLM) and it appears here with ZERO LibreChat
    # config. `models.default` is nominal only (schema requires ≥1); the real list
    # always comes from pwc_tars. The client recognizes this endpoint by its name
    # (TARS_LOCAL_ENDPOINT_NAME in data-provider) — rename both together.
    - name: 'vLLM'
      # pwc_tars sys_config VLLM_API_KEY (系統參數設定), read live like webSearch's.
      # Unset (DEFAULT/blank) means vLLM runs without --api-key and a placeholder is
      # sent instead. The real per-model baseURL is injected at request time (see
      # tars://local above).
      apiKey: '${tars:VLLM_API_KEY}'
      baseURL: 'tars://local'
      models:
        default: ['gemma-4-31B', 'gemma-4-26B-A4B']
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'vLLM'
      # LibreChat turns stream usage off for custom endpoints, so vLLM would report no
      # token counts and every model call between tool calls would go uncounted. vLLM
      # supports `stream_options.include_usage`, which this re-enables.
      addParams:
        streamUsage: true

# Web search runs on Tavily alone (search + page extract, no reranker), so no other
# provider's key is ever consulted and users get no key/provider dialog. The key is
# pwc_tars's sys_config KEY_TAVILY (系統參數設定), read live with a 30s cache — rotate
# it there, not in .env. Unset or pwc_tars unreachable → web search is unavailable.
webSearch:
  searchProvider: 'tavily'
  scraperProvider: 'tavily'
  rerankerType: 'none'
  tavilyApiKey: '${tars:KEY_TAVILY}'

# Spreadsheets are queried by pwc_tars's data tools (tars_data_* / tars_table_task), which
# download them from LibreChat per call. `none` stores the bytes only, so the whole sheet is
# never extracted into the prompt as text as well.
fileConfig:
  defaultLLMDeliveryPath:
    overrides:
      text/csv: none
      application/csv: none
      application/vnd.ms-excel: none
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: none
      # Audio is always transcribed (speech.stt below) and the text goes to the model,
      # whichever model the chat is on — as pwc_tars's own chat did.
      audio/*: text

# Speech-to-text for audio uploads (and the composer mic's external engine). Keys are
# pwc_tars's sys_config rows, read live like webSearch's — rotate them there.
# Audio attached in a Gemini chat (endpoint `google`) is transcribed by Gemini itself;
# every other chat, and the mic, uses the `provider` default.
# Transcripts are converted to Traditional Chinese with Taiwan phrasing (OpenCC s2twp),
# as pwc_tars did.
speech:
  stt:
    traditionalChinese: true
    provider: openai
    endpoints:
      google: gemini
    openai:
      apiKey: '${tars:KEY_OPEN_AI_API}'
      model: 'gpt-4o-mini-transcribe'
    gemini:
      apiKey: '${tars:KEY_GEMINI_API}'
      model: 'gemini-3.6-flash'

mcpServers:
  # Langflow integration — Langflow flows exposed as callable tools (the "Workflow ·" agents).
  # This entry is a template: at config load LibreChat replaces it with one server per Langflow
  # project holding a published flow (`workflow_<first 8 hex of the project id>`, titled after the
  # project, `withWorkflowMcpConfig` in packages/api/src/langflow/config.ts), and mirrors each
  # project into one "Workflow · <project>" agent with that project's flows as its tools. Each
  # chatting user gets the shared account's projects plus their own; a flow is published by its
  # MCP switch in Langflow. The url below stays the aggregate (every project in one server): it is
  # what the project urls are derived from, and what stays registered while Langflow cannot list
  # its projects. Nothing here is per-machine: the host is ${VITE_LANGFLOW_URL} (.env) and the key
  # ${LANGFLOW_API_KEY} (.env), which must be the Langflow system account's (LANGFLOW_SUPERUSER) —
  # Langflow refuses any other key on these endpoints. The key `workflow` must match
  # TARS_WORKFLOW_MCP_SERVER_NAME.
  workflow:
    type: streamable-http
    url: '${VITE_LANGFLOW_URL}/api/v1/tars/mcp/streamable'
    headers:
      x-api-key: '${LANGFLOW_API_KEY}'
      # 把發話者的 LibreChat user id 以 Langflow request-variable header 帶進 flow：
      # Langflow 會把 x-langflow-global-var-* 放進 graph.context.request_variables，
      # TarsAgent component 讀取後轉發 pwc_tars → LLM gateway 以該使用者身分解析個人 key。
      # 這個佔位符同時讓 workflow 的 MCP 連線變成 per-user scoped。
      x-langflow-global-var-librechat_user_id: '{{LIBRECHAT_USER_ID}}'
      # 發話者對應的 pwc_tars 使用者（sys_user.id）；pwc_tars 依此限制可用的知識庫，沒帶就不能用知識庫。
      x-langflow-global-var-tars_user_id: '{{LIBRECHAT_USER_TARSID}}'
    title: 'Workflow'
    description: '將 Workflow 流程作為可呼叫的工具'
    timeout: 60000
    # Hidden from the regular chat input toggle — the per-project "Workflow ·" Agents are the
    # intended entry point. Each project server is registered with `startup: false`: the headers
    # name the chatting user, so every connection is per-user anyway.
    chatMenu: false
    startup: true