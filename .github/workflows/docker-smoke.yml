name: Docker Build Smoke Tests

# Fork policy (release/26P3_dev): a full multi-stage Docker build costs ~25
# minutes and only answers "does the image still build", which the deploy
# pipeline already answers. Run it on demand before cutting an image instead of
# on every PR. See .github/workflows/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-package-target:
    name: Build Docker client package target
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build client package target
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.multi
          platforms: linux/amd64
          push: false
          target: client-package-build

